services:
  # redis-stack rather than plain redis: the gateway needs the RediSearch
  # module for vector similarity search on the Tier 2 cache.
  redis:
    image: redis/redis-stack:latest
    container_name: llm-gateway-redis
    ports:
      - "6379:6379"  # Redis
      - "8001:8001"  # RedisInsight UI
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
