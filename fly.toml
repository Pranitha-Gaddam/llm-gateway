# fly.toml app configuration file generated for llm-gateway-demo on 2026-08-30T18:36:59-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'llm-gateway-demo'
primary_region = 'iad'

[build]

[env]
  PUBLIC_DEMO = "true"
  WEB_CONCURRENCY = "2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
